# Скопируй на VPS: /etc/family-portal/config.yaml
# chmod 600, владелец family-portal

server:
  host: 127.0.0.1
  port: 3180

# Публичный адрес в vless-ссылках (НЕ localhost)
public_address: 2.26.9.208

# Секрет для подписи сессий — сгенерируй: openssl rand -hex 32
session_secret: CHANGE_ME_RANDOM_64_HEX

# Путь к БД 3X-UI (read-only)
xui_db_path: /etc/x-ui/x-ui.db

# Inbound по remark в панели
inbound_remark: family-reality

# Лог посещений (домены из access.log Xray) — только для admin_usernames
visit_log:
  enabled: true
  access_log_path: /var/log/x-ui/access.log
  db_path: /var/lib/family-portal/visits.db
  retention_days: 30
  admin_usernames:
    - admin          # логин портала админа (например user01)

# Telegram-бот: оплата и продление (без ЮKassa)
telegram:
  enabled: false
  bot_token: ""                    # @BotFather — только на VPS, не в git
  bot_username: "MyVpnBot"         # без @
  admin_chat_ids: [123456789]      # chat_id админа (@userinfobot)
  db_path: /var/lib/family-portal/bot.db
  link_token_ttl_seconds: 900      # 15 мин на привязку с портала
  payment:
    amount_rub: 400
    days: 30
    instructions: |
      Переведи 400 ₽ по СБП на номер +7XXXXXXXXXX.
      В комментарии укажи свой логин (user01, user02…).

# MTProto-прокси для Telegram (mtg). Общий секрет для всех — вариант A.
# Секрет генерит mtg: mtg generate-secret --hex www.cloudflare.com
mtproxy:
  enabled: false
  host: ""                 # пусто = public_address; можно задать домен/IP явно
  port: 8444               # 8443 занят вторым inbound xray — берём 8444
  secret: ""               # ee<32hex><domain_hex> — только на VPS, не в git

# Запасные VLESS-узлы (второй VPS). См. docs/stages/08-second-vps.md
# Появляются в Clash как AUTO (url-test) + ручной выбор.
# extra_nodes:
#   - name: "VPN-DE"
#     vless_link: "vless://UUID@IP:443?encryption=none&security=reality&..."

# Пользователи портала → клиенты 3X-UI (поле Email в панели)
users:
  - username: ivan
    password_hash: "$2b$12$..."   # scripts/05-family-portal-hash.py
    client_email: user01
    display_name: Иван

  - username: maria
    password_hash: "$2b$12$..."
    client_email: user02
    display_name: Мария

  # Клиент в другом inbound (клон для 4G / другой порт) — укажи remark из панели:
  # - username: user05
  #   password_hash: "$2b$12$..."
  #   client_email: user05
  #   display_name: ...
  #   inbound_remark: family-reality-2053
