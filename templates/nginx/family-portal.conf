# Фрагмент для /etc/nginx/sites-available/vpn-landing
# Вставь внутрь server { listen 80; ... } ПОСЛЕ location /.well-known/

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;

location /portal/ {
    limit_req zone=portal_login burst=5 nodelay;

    proxy_pass http://127.0.0.1:3180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Статика портала (опционально — можно проксировать через FastAPI)
location /static/ {
    proxy_pass http://127.0.0.1:3180;
    proxy_set_header Host $host;
}
